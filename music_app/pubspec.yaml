name: muzee
description: "Muzee develop by balua.dev"
publish_to: 'none'
version: 2.0.0+20261031

environment:
  sdk: '>=3.11.0 <4.0.0'
  flutter: ^3.41.6

dependencies:
  app_links: ^7.0.0
  audio_service: ^0.18.18
  audio_session: ^0.2.3
  cached_network_image: ^3.4.1
  cloud_firestore: ^7.1.0
  dynamic_color: ^1.8.1
  file_picker: ^11.0.2
  firebase_analytics: ^13.0.1
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  firebase_remote_config: ^7.0.1
  floating: ^6.0.0
  fluentui_system_icons: ^1.1.273
  flutter:
    sdk: flutter
  flutter_appauth: ^12.1.0
  flutter_flip_card: ^0.0.6
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^10.3.4
  go_router: ^17.2.1
  google_mobile_ads: ^8.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  html: ^0.15.6
  http: ^1.6.0
  in_app_purchase: ^3.2.3
  intl: ^0.20.2
  isar_community: ^3.4.1
  isar_community_flutter_libs: ^3.4.1
  media_kit: ^1.2.6
  media_kit_libs_video: ^1.0.7
  media_kit_video: ^2.0.1
  path_provider: ^2.1.5
  receive_sharing_intent:
    path: ./packages/receive_sharing_intent
  rxdart: ^0.28.0
  shared_preferences: ^2.5.6
  shimmer: ^3.0.0
  tuber_playback:
    path: ./packages/tuber_playback
  url_launcher: ^6.3.2
  youtube_charts:
    git:
      url: https://github.com/baluadev/ytb_tuber_service.git
      path: youtube_charts
  youtube_explode_dart:
    path: ./packages/youtube_explode_dart

dev_dependencies:
  build_runner: ^2.15.1
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  isar_community_generator: ^3.4.1
  patrol: ^4.10.0

  # flutter_lints: ^2.0.0

flutter:
  generate: true
  uses-material-design: true

  # Licenses are shown on the app's licenses page (see registerNeoFontLicenses).
  assets:
    - assets/brand/muzee_icon.png
    - assets/fonts/inter/OFL.txt
    - assets/fonts/space_grotesk/OFL.txt

  # Variable fonts: FontWeight drives the wght axis, so one file per family.
  # Inter: wght 100-900. Space Grotesk: wght 300-700.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Variable.ttf
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/space_grotesk/SpaceGrotesk-Variable.ttf

# Patrol E2E config (CLI: dart pub global activate patrol_cli; then run `patrol test`).
# Muzee has no flavors or build-type suffix: google-services.json only knows
# up.nexstudio.muzee.
patrol:
  app_name: Muzee
  test_directory: patrol_test
  android:
    package_name: up.nexstudio.muzee
